<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cindy Trimm — External Destination</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="main/index.html"><img src="assets/logo-mark.png" alt="Cindy Trimm monogram"><span>CINDY&nbsp;TRIMM</span></a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false" type="button">
    <svg class="nav-toggle-icon-bars" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <svg class="nav-toggle-icon-x" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="1.8" style="display:none;"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <nav class="site-nav"></nav>
  <div class="header-actions"><a class="login-link" href="trim360/login.html">Login</a></div>
</header>

<main>

<section style="padding:120px 56px; display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; min-height:50vh;">
  <span class="tag">EXTERNAL SYSTEM - NOT PART OF THIS MOCKUP</span>
  <h1 id="label" style="font-size:30px; max-width:640px;">This Action Connects to an External System</h1>
  <p id="detail" style="font-family:var(--font-body); font-size:14.5px; color:rgba(42,42,42,0.7); max-width:560px; margin:0;"></p>
  <button type="button" onclick="history.back()" class="btn-outline" style="margin-top:12px; cursor:pointer;">← Go Back</button>
</section>

</main>

<script>
  var params = new URLSearchParams(window.location.search);
  var service = params.get('service') || 'an external system';
  var label = params.get('label');
  if (label) {
    document.getElementById('label').textContent = '“' + label + '” Connects to an External System';
  }
  document.getElementById('detail').textContent =
    'In production, this button routes to ' + service + '. That integration is out of scope for this mockup — shown here as a placeholder destination per the brief’s annotation system.';
</script>

<script src="assets/nav.js" defer></script>
<script src="assets/motion.js" defer></script>
</body>
</html>
