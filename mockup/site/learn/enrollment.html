<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cindy Trimm — Enrollment</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .step { display:flex; align-items:center; gap:8px; }
  .step-num { width:26px; height:26px; border-radius:50%; background:var(--charcoal); color:var(--ivory); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:13px; flex-shrink:0; }
  .step.is-current .step-num { background:var(--rose); }
  .step-label { font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:rgba(42,42,42,0.55); }
  .step.is-current .step-label { color:var(--charcoal); font-weight:700; }
  .step-line { width:40px; height:1px; background:rgba(42,42,42,0.2); }
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="../main/index.html"><img src="../assets/logo-mark.png" alt="Cindy Trimm monogram"><span>CINDY&nbsp;TRIMM</span></a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false" type="button">
    <svg class="nav-toggle-icon-bars" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <svg class="nav-toggle-icon-x" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="1.8" style="display:none;"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <nav class="site-nav"><a href="index.html" class="active">Learn</a></nav>
  <div class="header-actions"><a class="login-link" href="../trim360/login.html">Login</a></div>
</header>

<main>

<section style="padding:48px 56px 0 56px;">
  <div style="display:flex; align-items:center; justify-content:center; gap:12px;">
    <div class="step is-current"><span class="step-num">1</span><span class="step-label">Enrollment</span></div>
    <span class="step-line"></span>
    <div class="step"><span class="step-num">2</span><span class="step-label">Payment Handoff</span></div>
    <span class="step-line"></span>
    <div class="step"><span class="step-num">3</span><span class="step-label">Confirmation</span></div>
    <span class="step-line"></span>
    <div class="step"><span class="step-num">4</span><span class="step-label">TRIM360</span></div>
  </div>
</section>

<section style="padding:48px 56px 96px 56px; max-width:640px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:28px; text-align:center;">
  <div>
    <p class="eyebrow" style="text-align:center;">Step 1</p>
    <h1 id="enroll-heading" style="font-size:28px;">Confirm Your Enrollment</h1>
    <p id="enroll-detail" style="font-family:var(--font-body); font-size:14px; color:rgba(42,42,42,0.78); margin-top:12px;"></p>
  </div>

  <div style="border:1px solid rgba(42,42,42,0.12); padding:28px; display:flex; flex-direction:column; gap:14px; text-align:left;">
    <div class="field"><label for="enr-name">Full Name</label><input id="enr-name" name="full_name" type="text" required></div>
    <div class="field"><label for="enr-email">Email</label><input id="enr-email" name="email" type="email" required></div>
  </div>

  <span class="tag" style="align-self:center;">[STRIPE CHECKOUT HANDOFF - INTEGRATION PENDING]</span>
  <a href="enrollment-confirmation.html" id="checkout-link" class="btn-primary" style="align-self:center;">Continue to Secure Checkout</a>
</section>

</main>

<footer class="site-footer">
  <div class="cols">
    <div class="brand"><img src="../assets/logo-mark.png" alt="Cindy Trimm monogram"><span>CINDY TRIMM</span></div>
    <div class="col"><h3>Ecosystem</h3><a href="index.html">Learn</a></div>
  </div>
  <div class="bottom"><span>© Cindy Trimm. All rights reserved.</span></div>
</footer>

<script>
  var params = new URLSearchParams(window.location.search);
  var type = params.get('type');
  var courseName = params.get('name');
  var tier = params.get('tier');
  var label = tier ? (tier + ' Subscription') : (courseName || 'this program');
  document.getElementById('enroll-detail').textContent = "You're enrolling in: " + label;
  var link = document.getElementById('checkout-link');
  link.href = 'enrollment-confirmation.html?' + params.toString();
</script>

<script src="../assets/nav.js" defer></script>
<script src="../assets/motion.js" defer></script>
</body>
</html>
